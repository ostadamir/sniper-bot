name: Risk Manager Bot

on:
  schedule:
    - cron: '*/16 * * * *'
  workflow_dispatch:

concurrency:
  group: risk-manager-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Manager Bot
      env:
        # 🌟 این خطوط جدید اضافه شدند تا کلیدهای صرافی به ربات داده بشن
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TRUETRADE_KEY: ${{ secrets.TRUETRADE_KEY }}
        TRUETRADE_SECRET: ${{ secrets.TRUETRADE_SECRET }}
      run: python bot.py

    - name: Commit and Push State
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "Update state file" || exit 0
        git pull --rebase origin main
        git push
