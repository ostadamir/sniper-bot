name: Risk Manager Bot

on:
  schedule:
    - cron: '*/16 * * * *' # هر 30 دقیقه
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Manager Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRUETRADE_KEY: ${{ secrets.TRUETRADE_KEY }}
          TRUETRADE_SECRET: ${{ secrets.TRUETRADE_SECRET }}
        run: python bot.py

      - name: Commit and Push State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add manager_state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update manager state [skip ci]"
          git push
