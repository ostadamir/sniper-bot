name: Risk Manager Bot

on:
  schedule:
    # اجرای ربات هر 16 دقیقه
    - cron: '*/16 * * * *'
  workflow_dispatch:

# 🌟 جلوگیری از اجرای همزمان دو ربات برای جلوگیری از باگ Push
concurrency:
  group: risk-manager-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Manager Bot
      run: python bot.py

    - name: Commit and Push State
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "Update state file" || exit 0
        # 🌟 دریافت آخرین تغییرات قبل از آپلود برای جلوگیری از ارور
        git pull --rebase origin main
        git push
