name: Risk Manager Bot

on:
  workflow_dispatch:

concurrency:
  group: tt-manager
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Listener
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u listener.py

      - name: Run Manager Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRUETRADE_KEY: ${{ secrets.TRUETRADE_KEY }}
          TRUETRADE_SECRET: ${{ secrets.TRUETRADE_SECRET }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
        run: python -u bot.py

      - name: Commit and Push State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          for f in manager_state.json processed_signals.json; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -m "Update state" || echo "No changes to commit"
          git pull --rebase --autostash origin main
          git push
