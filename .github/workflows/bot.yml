name: Risk Manager Bot

on:
  workflow_dispatch:

concurrency:
  group: tt-manager
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Listener
        continue-on-error: true
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # 👈 این خط اضافه شد
        run: python -u listener.py

      - name: Run Manager Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRUETRADE_KEY: ${{ secrets.TRUETRADE_KEY }}
          TRUETRADE_SECRET: ${{ secrets.TRUETRADE_SECRET }}
        run: python -u bot.py

      - name: Commit and Push State
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git rebase --abort || true
          
          for f in manager_state.json processed_signals.json pending_signals.txt last_msg_id.txt; do
            [ -f "$f" ] && git add "$f"
          done
          
          git commit -m "Update state" || echo "No changes to commit"
          
          ok=0
          for i in 1 2 3; do
            if git pull --no-rebase -X ours origin main && git push; then ok=1; break; fi
            git merge --abort || true
            sleep 2
          done
          
          if [ "$ok" != "1" ]; then echo "PUSH FAILED"; exit 1; fi
