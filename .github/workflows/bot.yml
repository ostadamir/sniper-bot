name: Risk Manager Bot

on:
  # تایمر داخلی غیرفعال است تا با کرون‌جاب تداخل نداشته باشد
  # schedule:
  #   - cron: '*/16 * * * *'
  
  workflow_dispatch:

concurrency:
  group: risk-manager-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 🛑 مرحله جدید: اجرای شنونده چنل آدم
      - name: Run Listener
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python listener.py

      # اجرای ربات اصلی مدیریت سرمایه
      - name: Run Manager Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRUETRADE_KEY: ${{ secrets.TRUETRADE_KEY }}
          TRUETRADE_SECRET: ${{ secrets.TRUETRADE_SECRET }}
        run: python bot.py

      - name: Commit and Push State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add manager_state.json
          git commit -m "Update state" || echo "No changes to commit"
          git push
