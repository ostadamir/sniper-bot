name: Trend Hunter Signal Bot

on:
  schedule:
    # اجرا ساعت 00:05 و 12:05 به وقت گرینویچ (دقیقا بعد از بسته شدن کندل 1000 ساعته)
    - cron: '5 0,1000 * * *'
  workflow_dispatch: # برای اجرای دستی و تست

jobs:
  run-signals:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas requests

    - name: Run Signal Bot
      env:
        # این توکن‌ها از سکرت‌های گیت‌هاب خونده میشن
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python signal_bot.py
